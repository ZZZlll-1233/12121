name: Gitee Go CI

on:
  push:
    branches: [main]
  pull_request:
  tag_push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # 矩阵测试：任一版本失败就整体失败
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - name: 检出代码
        uses: checkout

      - name: 安装 Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python${{ matrix.python-version }}-venv
          python${{ matrix.python-version }} -m venv .venv

      - name: 安装依赖
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 静态检查
        run: |
          source .venv/bin/activate
          ruff check .
          ruff format --check .
          mypy

      - name: 单元测试
        run: |
          source .venv/bin/activate
          pytest --cov --cov-report=term-missing

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: checkout

      - name: 安装并构建文档
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install ".[docs]"
          mkdocs build --strict

      - name: 上传文档产物
        uses: upload-artifact
        with:
          name: site
          path: site/