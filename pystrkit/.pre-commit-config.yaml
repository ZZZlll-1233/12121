repos:
  - repo: https://gitee.com/LongbinChen/pre-commit
    rev: v2.4.0
    hooks:
      - id: pylevel
        name: pylevel
        entry: python -m pylevel --version-file=pyproject.toml --line-length=120
        language: python
        stages: [commit]

  - repo: https://gitee.com/lituobin/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://gitee.com/pre-commit/mirrors-mypy
    rev: v1.11.1
    hooks:
      - id: mypy
        additional_dependencies: [pytest]
        args: [--strict]